<nav class="navbar navbar-light fixed-top">
  <div class="navbar-fluid p-0 m-0">

    <!-- Burger menu mobile -->
    <input type="checkbox" id="nav-toggle" class="nav-toggle" />
    <label for="nav-toggle" class="burger">
      <span></span>
      <span></span>
      <span></span>
    </label>

    <!-- Bloc gauche -->
    <div class="left-nav d-flex align-items-center flex-wrap ">
      <a class="btn text-nowrap" href="/#services">{{ _("Services") }}</a>
      <a class="btn text-nowrap" href="/#agenda">{{ _("Actualités") }}</a>
      <a class="btn btn-active text-nowrap" href="/#erp">{{ _("ERP") }}</a>
      <a class="btn text-nowrap" href="/#bigdata">{{ _("Big Data") }}</a>
      <a class="btn text-nowrap" href="/#sourcing">{{ _("Sourcing") }}</a>
      <a class="btn text-nowrap" href="/#formation">{{ _("Formations") }}</a>
    </div>

    <!-- Logo centré -->
    <a class="navbar-brand mx-auto d-flex align-items-center gap-1 " href="/">
      <img src="/assets/amoamancustom/images/logo.webp" alt="{{ _('Logo') }}" />
      <span>AMOAMAN & ASSOCIES</span>
    </a>

    <!-- Bloc droit -->
    <div class="right-nav d-flex align-items-center flex-wrap justify-content-end ">
      <a class="btn text-nowrap" href="/#conformite">{{ _("Mise en Conformité") }}</a>
      <a class="btn text-nowrap" href="/#apropos">{{ _("A propos") }}</a>
      <a class="btn text-nowrap" href="/#faq">{{ _("FAQ") }}</a>
      <a href="/contact" class="btn text-nowrap d-none d-md-block btn-contact">{{ _("Contactez-nous") }}</a>
    </div>

  </div>
</nav>


<script>
document.addEventListener("DOMContentLoaded", function () {
  const sections = document.querySelectorAll("section[id]");
  const navLinks = document.querySelectorAll(".navbar .btn[href^='/#']");
  const navToggle = document.getElementById("nav-toggle");

  function activateLink() {
    let scrollPos = window.scrollY + 150;
    let found = false;

    sections.forEach((section) => {
      const top = section.offsetTop;
      const height = section.offsetHeight;
      const id = section.getAttribute("id");

      if (scrollPos >= top && scrollPos < top + height) {
        found = true;
        navLinks.forEach((link) => {
          link.classList.remove("btn-active");
          if (link.getAttribute("href") === `/#${id}`) {
            link.classList.add("btn-active");
          }
        });
      }
    });

    if (!found) {
      navLinks.forEach((link) => link.classList.remove("btn-active"));
      const firstLink = document.querySelector(".navbar .btn[href='/#services']");
      if (firstLink) firstLink.classList.add("btn-active");
    }
  }

  // Fermer menu mobile après clic
  navLinks.forEach(link => {
    link.addEventListener("click", () => {
      if (navToggle.checked) navToggle.checked = false;
    });
  });

  // Fermer menu si clic en dehors
  document.addEventListener("click", (e) => {
    if (navToggle.checked && 
        !e.target.closest(".navbar") && 
        !e.target.closest(".burger")) {
      navToggle.checked = false;
    }
  });

  window.addEventListener("scroll", activateLink);
  activateLink();
});


</script>
